name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint-and-test:
    name: Ruff · Mypy · Pytest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pytest pytest-cov

      - name: Ruff lint
        run: ruff check agents/ app.py tests/ evals/

      - name: Mypy type-check (agents package)
        run: mypy agents/ --ignore-missing-imports --no-strict-optional

      - name: Pytest (unit tests only — no API calls)
        run: pytest tests/ -v --tb=short
