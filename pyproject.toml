[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research-assistant-crew"
version = "0.2.0"
description = "A multi-agent LangGraph research pipeline powered by Groq and Tavily."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Research Crew Contributors" }]

dependencies = [
    "streamlit==1.54.0",
    "langchain-core==1.5.1",
    "langchain-groq==1.1.3",
    "langgraph==0.6.11",
    "tavily-python==0.7.27",
    "python-dotenv==1.0.0",
    "pydantic==2.11.1",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-cov==6.2.1",
    "ruff==0.11.12",
    "mypy==1.16.1",
]

[tool.setuptools]
py-modules = ["app"]
packages = ["agents"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]  # line length handled by formatter

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
no_strict_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
